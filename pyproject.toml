[project]
name = "crf"
version = "0.1.0"
description = "A new Python project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crf = "crf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crf"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.11",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

